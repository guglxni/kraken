name: incident_summary
version: 1.0.0
description: >
  Given an active or recent incident, build a complete brief: which deploy
  triggered it, who authored the suspect PR, whether a third-party outage is
  masking internal problems, and what the blast radius looks like across
  customers. Routes to the Helm agent for SRE response.
required_sources:
  - sentry
  - github
  - datadog
  - stripe
target_agent: helm
params:
  incident_id:
    type: string
    description: PagerDuty / Sentry incident ID
  lookback_hours:
    type: integer
    description: Hours to look back for correlated events
    default: 4
output_schema:
  - name: incident_id
    type: string
  - name: title
    type: string
  - name: started_at
    type: string
  - name: suspect_deploy_sha
    type: string
  - name: suspect_pr_number
    type: integer
  - name: suspect_pr_title
    type: string
  - name: pr_author
    type: string
  - name: error_spike_count
    type: integer
  - name: affected_customer_count
    type: integer
  - name: affected_mrr_total
    type: float
  - name: p99_latency_ms
    type: float
  - name: third_party_outage_detected
    type: boolean
sql: |
  WITH incident AS (
    SELECT
      i.id                                          AS incident_id,
      i.title,
      i.status,
      i.started_at,
      i.resolved_at,
      i.severity
    FROM sentry.issues i
    WHERE i.id = '{{ params.incident_id }}'
    LIMIT 1
  ),

  error_spike AS (
    SELECT
      COUNT(*)                                      AS error_spike_count,
      ARRAY_AGG(DISTINCT e.type ORDER BY COUNT(*) DESC LIMIT 5)
                                                    AS top_error_types,
      MIN(e.timestamp)                              AS first_error_at
    FROM sentry.errors e
    JOIN incident inc ON TRUE
    WHERE e.timestamp >= inc.started_at - INTERVAL '30 minutes'
      AND e.timestamp <= COALESCE(inc.resolved_at, CURRENT_TIMESTAMP)
      AND e.issue_id = inc.incident_id
  ),

  suspect_deploy AS (
    SELECT
      d.sha,
      d.created_at                                  AS deployed_at,
      d.creator_login                               AS deployer,
      ROW_NUMBER() OVER (ORDER BY d.created_at DESC) AS rn
    FROM github.deployments d
    JOIN incident inc ON TRUE
    WHERE d.environment IN ('production', 'prod')
      AND d.created_at BETWEEN inc.started_at - INTERVAL '{{ params.lookback_hours }} hours'
        AND inc.started_at + INTERVAL '30 minutes'
    ORDER BY d.created_at DESC
    LIMIT 3
  ),

  suspect_pr AS (
    SELECT
      pr.number                                     AS pr_number,
      pr.title                                      AS pr_title,
      pr.user__login                                AS pr_author,
      pr.merged_at,
      pr.additions                                  AS lines_added,
      pr.deletions                                  AS lines_removed
    FROM github.pull_requests pr
    JOIN suspect_deploy sd
      ON pr.head__sha = sd.sha
      AND sd.rn = 1
    LIMIT 1
  ),

  blast_radius AS (
    SELECT
      COUNT(DISTINCT e.customer_id)                 AS affected_customer_count,
      COALESCE(SUM(DISTINCT sub.mrr), 0)            AS affected_mrr_total
    FROM sentry.errors e
    JOIN incident inc ON TRUE
    LEFT JOIN stripe.subscriptions sub
      ON sub.customer_id = e.customer_id
    WHERE e.issue_id = inc.incident_id
      AND e.timestamp >= inc.started_at
  ),

  latency_snapshot AS (
    SELECT
      PERCENTILE_CONT(0.99) WITHIN GROUP (ORDER BY m.value)
                                                    AS p99_latency_ms
    FROM datadog.metrics m
    JOIN incident inc ON TRUE
    WHERE m.metric_name = 'request.duration_ms'
      AND m.timestamp >= inc.started_at - INTERVAL '5 minutes'
      AND m.timestamp <= COALESCE(inc.resolved_at, CURRENT_TIMESTAMP)
  ),

  third_party_check AS (
    SELECT
      COUNT(*) > 0                                  AS third_party_outage_detected
    FROM webhooks.events we
    JOIN incident inc ON TRUE
    WHERE we.source IN ('pagerduty', 'statuspage', 'aws_health')
      AND we.event_type IN ('incident.created', 'component.degraded')
      AND we.received_at >= inc.started_at - INTERVAL '30 minutes'
      AND we.received_at <= COALESCE(inc.resolved_at, CURRENT_TIMESTAMP)
  )

  SELECT
    inc.incident_id,
    inc.title,
    inc.started_at,
    sd.sha                                          AS suspect_deploy_sha,
    sp.pr_number                                    AS suspect_pr_number,
    sp.pr_title                                     AS suspect_pr_title,
    sp.pr_author,
    es.error_spike_count,
    br.affected_customer_count,
    br.affected_mrr_total,
    ls.p99_latency_ms,
    tpc.third_party_outage_detected
  FROM incident inc
  CROSS JOIN error_spike es
  LEFT JOIN suspect_deploy sd ON sd.rn = 1
  LEFT JOIN suspect_pr sp ON TRUE
  CROSS JOIN blast_radius br
  CROSS JOIN latency_snapshot ls
  CROSS JOIN third_party_check tpc
  LIMIT 1
