tools:
  - name: coral_sql
    description: Execute a SQL query against Coral's federated sources
    parameters:
      query:
        type: string
        description: The SQL query text
        max_length: 8000
    restrictions:
      allowed_sources:
        - linear
        - jira
        - clickup
        - github.pulls
        - slack.messages
        - confluence
        - notion
        - kraken.findings
