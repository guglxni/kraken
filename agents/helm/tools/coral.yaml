tools:
  - name: coral_sql
    description: Execute a SQL query against Coral's federated sources
    parameters:
      query:
        type: string
        description: The SQL query text
        max_length: 8000
    restrictions:
      allowed_sources:
        - pagerduty
        - datadog
        - cloudwatch
        - openobserve
        - statusgator
        - github.deployments
        - github.pulls
        - incident
        - slack.messages
        - kraken.findings
