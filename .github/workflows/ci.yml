name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python — lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check kraken/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check kraken/ tests/

      - name: Type check (mypy --strict)
        run: uv run mypy kraken/ --strict

      - name: Security check (bandit)
        run: uv run bandit -r kraken/ -ll

      - name: Test
        run: uv run pytest tests/ -x -q --timeout=90
        env:
          KRAKEN_ENV: test

  typescript:
    name: TypeScript — biome, tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Biome check
        run: pnpm biome check .

      - name: TypeScript check
        run: pnpm tsc --noEmit
